name: Build term index

# The inverted index reads every stored document to collect its terms, so it is
# kept out of the ingestion workflow: that one is already sized against
# GitHub's hosted-runner job limit, and a full pass here would crowd it out.
on:
  schedule:
    # Weekly. Each run rewrites every shard, and R2 bills Class A operations
    # past one million per month, so a daily rebuild would spend that allowance
    # on an index whose content barely moves between runs.
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum cases to index; use a small number for a first canary run"
        required: false
        default: "0"
        type: string
      shard-count:
        description: "Number of term shards"
        required: false
        default: "4096"
        type: string
      concurrency:
        description: "Parallel R2 readers; a full pass is ~200k round trips"
        required: false
        default: "16"
        type: string

concurrency:
  # Two builds would write different generations into the same slot.
  group: term-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-cloud.txt
      - name: Install R2 dependencies
        run: python -m pip install --requirement scripts/requirements-cloud.txt
      - name: Build the inverted term index
        run: >-
          python -u scripts/build_term_index.py
          --shard-count ${{ inputs.shard-count || '4096' }}
          --limit ${{ inputs.limit || '0' }}
          --concurrency ${{ inputs.concurrency || '16' }}

  alert:
    # Scheduled runs have no one watching them; an ingest shard died on a
    # transient R2 error in August 2026 and went unnoticed for two days.
    needs: [build]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Term index build failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "$TITLE in:title" \
            --json number,title -q "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: [run]($RUN_URL)"
          else
            gh issue create --title "$TITLE" \
              --body "$(printf '%s\n' "A scheduled run failed." "" "[Run]($RUN_URL)" "" "Close this once the next run succeeds.")"
          fi
