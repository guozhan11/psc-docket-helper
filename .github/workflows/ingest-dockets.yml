name: Ingest DC PSC dockets

on:
  schedule:
    # Cloudflare usage windows reset at 00:00 UTC.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Resume the full backfill or refresh recent filings"
        required: true
        default: all
        type: choice
        options:
          - all
          - recent
      limit:
        description: "Maximum eligible filings; 0 means run until the time limit"
        required: false
        default: "0"
        type: string
      concurrency:
        description: "Parallel PDF extraction workers"
        required: false
        default: "8"
        type: string
      max_hours:
        description: "Stop cleanly before the GitHub Actions timeout"
        required: false
        default: "5"
        type: string

concurrency:
  group: psc-docket-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-cloud.txt
      - name: Validate R2 credentials
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Install the PDF extractor
        run: python -m pip install --requirement scripts/requirements-cloud.txt
      - name: Refresh recent public filings
        if: github.event_name == 'schedule'
        run: >-
          python scripts/fast_r2_ingest.py
          --since-days 3
          --limit 300
          --concurrency 8
          --max-hours 0.5
      - name: Resume fast all-case backfill
        if: github.event_name == 'schedule'
        run: >-
          python scripts/fast_r2_ingest.py
          --all
          --concurrency 8
          --max-hours 4.75
      - name: Run manual ingestion
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency }}
          INPUT_MAX_HOURS: ${{ inputs.max_hours }}
        run: |
          if [ "$INPUT_SCOPE" = "recent" ]; then
            python scripts/fast_r2_ingest.py --since-days 3 --limit "$INPUT_LIMIT" --concurrency "$INPUT_CONCURRENCY" --max-hours "$INPUT_MAX_HOURS"
          else
            python scripts/fast_r2_ingest.py --all --limit "$INPUT_LIMIT" --concurrency "$INPUT_CONCURRENCY" --max-hours "$INPUT_MAX_HOURS"
          fi
