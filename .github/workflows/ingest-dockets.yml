name: Ingest DC PSC dockets

on:
  schedule:
    # Four near-continuous windows per day; each extraction job stops before
    # GitHub's hosted-runner job limit.
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "Build metadata only or build metadata then resume full text"
        required: true
        default: all
        type: choice
        options:
          - all
          - metadata
      limit:
        description: "Maximum eligible filings per shard; use 100 for a free-tier canary"
        required: false
        default: "100"
        type: string
      concurrency:
        description: "PDF workers per shard (4 shards run in parallel)"
        required: false
        default: "2"
        type: string
      max_hours:
        description: "Stop cleanly before the GitHub Actions timeout"
        required: false
        default: "5.25"
        type: string

concurrency:
  group: psc-docket-ingestion
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Keep aggregate DC PSC metadata traffic to two sequential requests.
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-cloud.txt
      - name: Validate R2 credentials
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Install the PDF extractor
        run: python -m pip install --requirement scripts/requirements-cloud.txt
      - name: Publish filing metadata and official links first
        shell: bash
        env:
          INPUT_SCOPE: ${{ inputs.scope }}
        run: |
          if [ "$INPUT_SCOPE" = "metadata" ]; then
            MODE=full
          else
            MODE=auto
          fi
          python -u scripts/metadata_r2_ingest.py \
            --mode "$MODE" \
            --since-days 3 \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --max-hours 1.0 \
            --checkpoint-records 5000

  ingest:
    needs: metadata
    # Scheduled full-text work stays paused during compact-format migration.
    # Set repository variable ENABLE_SCHEDULED_INGEST=true after a manual
    # canary confirms storage is shrinking and search remains healthy.
    if: >-
      ${{ needs.metadata.result == 'success' &&
          ((github.event_name == 'workflow_dispatch' && inputs.scope == 'all') ||
           (github.event_name == 'schedule' && vars.ENABLE_SCHEDULED_INGEST == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One shard at a time keeps API and free-tier growth observable.
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      INPUT_LIMIT: ${{ inputs.limit || '0' }}
      INPUT_CONCURRENCY: ${{ inputs.concurrency || '2' }}
      INPUT_MAX_HOURS: ${{ inputs.max_hours || '5.25' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-cloud.txt
      - name: Install the PDF extractor
        run: python -m pip install --requirement scripts/requirements-cloud.txt
      - name: Extract one non-overlapping filing range without OCR
        run: >-
          python scripts/fast_r2_ingest.py
          --all
          --limit "$INPUT_LIMIT"
          --concurrency "$INPUT_CONCURRENCY"
          --max-hours "$INPUT_MAX_HOURS"
          --shard-index "${{ matrix.shard }}"
          --shard-count 4
