name: Monitor health

# The health endpoint is fail-closed, but nothing was watching it. It reported
# degraded for days in August 2026 and the first anyone knew was a screenshot.
# This turns that signal into a GitHub issue, which does reach a notification.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      health-url:
        description: "Override the URL, to confirm the alarm path still fires"
        required: false
        default: ""
        type: string

concurrency:
  group: monitor-health
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  HEALTH_URL: ${{ inputs.health-url || 'https://psc-docket-assistant.psc-docket-helper.workers.dev/api/health?live=1' }}
  # One open issue per condition, reused rather than reopened, so a long outage
  # does not bury the repository under a new issue every half hour.
  ALERT_TITLE: "Health check: /api/health is not ok"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read health
        id: health
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 30 "$HEALTH_URL" || true)
          code=${code:-000}
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          python3 scripts/parse_health_response.py \
            --http-code "$code" \
            --response response.json >> "$GITHUB_OUTPUT"

      - name: Open or close the alert
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ steps.health.outputs.status }}
          ISSUES: ${{ steps.health.outputs.issues }}
          HTTP_CODE: ${{ steps.health.outputs.http_code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # GitHub's API occasionally returns a transient 5xx. Retry notification
          # operations so an API blip is not mistaken for an unhealthy service.
          gh_retry() {
            local attempt=1
            local max_attempts=5
            local delay=2

            while true; do
              if "$@"; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "::warning::GitHub API command failed (attempt $attempt/$max_attempts); retrying in ${delay}s." >&2
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          if ! existing=$(gh_retry gh issue list --state open --search "$ALERT_TITLE in:title" \
            --json number,title -q "[.[] | select(.title == \"$ALERT_TITLE\")] | .[0].number // empty"); then
            echo "::warning::Could not read the health alert after retries; issue synchronization will resume on the next run."
            if [ "$STATUS" = "ok" ]; then
              echo "Health is ok, so a notification API failure will not fail this run."
              exit 0
            fi
            echo "::error::Health is $STATUS (HTTP $HTTP_CODE), and the alert issue could not be synchronized."
            exit 1
          fi

          if [ "$STATUS" = "ok" ]; then
            if [ -n "$existing" ]; then
              if ! gh_retry gh issue comment "$existing" --body "Recovered: \`/api/health\` reports \`ok\` with no issues. [Run]($RUN_URL)"; then
                echo "::warning::Health recovered, but the recovery comment could not be posted after retries."
              fi
              if gh_retry gh issue close "$existing"; then
                echo "Closed alert #$existing — health recovered."
              else
                echo "::warning::Health recovered, but alert #$existing could not be closed after retries; the next run will try again."
              fi
            else
              echo "Healthy."
            fi
            exit 0
          fi

          body=$(printf '%s\n' \
            "\`/api/health\` reports **$STATUS** (HTTP $HTTP_CODE)." \
            "" \
            "Reported issues: \`$ISSUES\`" \
            "" \
            "What the issue names usually means:" \
            "- \`term-index-stale\` — the weekly \`Build term index\` workflow has not published for over ten days." \
            "- \`case-router-stale\` / \`metadata-stale\` — an ingestion cycle is failing or timing out." \
            "- \`*-unavailable\` — an R2 object the Worker needs did not read back." \
            "- \`turnstile-misconfigured\` — site key and secret disagree; chat protection is off." \
            "" \
            "This issue closes itself when health returns to \`ok\`." \
            "" \
            "[Run]($RUN_URL)")

          if [ -n "$existing" ]; then
            echo "Alert #$existing already open; leaving it as the single notification."
          else
            if ! gh_retry gh issue create --title "$ALERT_TITLE" --body "$body"; then
              echo "::warning::The health alert issue could not be created after retries."
            fi
          fi
          # Fail the run too, so the Actions list shows red alongside the issue.
          exit 1
